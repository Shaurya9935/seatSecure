<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | book-my-show</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap");
      body {
        font-family: "Outfit", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-slate-100 flex items-center justify-center p-6">
    <main class="w-full max-w-md rounded-2xl border border-slate-700/60 bg-slate-800/80 backdrop-blur-xl p-8 shadow-2xl">
      <h1 class="text-3xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-cyan-400">Create New Password</h1>
      <p class="text-slate-400 mb-6">Enter your new password below.</p>

      <form id="reset-form" class="space-y-4">
        <div>
          <label for="password" class="block text-sm mb-1 text-slate-300">New Password</label>
          <input id="password" name="password" type="password" required minlength="8" placeholder="At least 8 characters" class="w-full rounded-xl border border-slate-600 bg-slate-900/70 px-4 py-3 outline-none focus:ring-2 focus:ring-sky-400" />
        </div>

        <div>
          <label for="confirm-password" class="block text-sm mb-1 text-slate-300">Confirm Password</label>
          <input id="confirm-password" name="confirm-password" type="password" required minlength="8" class="w-full rounded-xl border border-slate-600 bg-slate-900/70 px-4 py-3 outline-none focus:ring-2 focus:ring-sky-400" />
        </div>

        <button type="submit" class="w-full rounded-xl bg-sky-500 px-4 py-3 font-semibold text-white transition hover:bg-sky-400">Reset Password</button>
      </form>

      <p id="message" class="mt-4 text-sm"></p>

      <p class="mt-6 text-center">
        <a href="/login.html" class="text-slate-300 hover:text-white">Back to login</a>
      </p>
    </main>

    <script>
      const API_BASE = "http://localhost:4000/api/auth";
      const form = document.getElementById("reset-form");
      const messageEl = document.getElementById("message");
      const passwordInput = document.getElementById("password");
      const confirmPasswordInput = document.getElementById("confirm-password");

      // Extract token from URL
      const getTokenFromUrl = () => {
        // Check if token is in query params
        const params = new URLSearchParams(window.location.search);
        if (params.get("token")) {
          return params.get("token");
        }

        // Check if token is in pathname (e.g., /reset-password/TOKEN)
        const pathParts = window.location.pathname.split("/");
        const resetIndex = pathParts.indexOf("reset-password");
        if (resetIndex !== -1 && pathParts[resetIndex + 1]) {
          return pathParts[resetIndex + 1];
        }

        return null;
      };

      const token = getTokenFromUrl();
      if (!token) {
        messageEl.textContent = "Invalid or missing reset token";
        messageEl.classList.add("text-rose-400");
        form.style.display = "none";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        messageEl.textContent = "";
        messageEl.className = "mt-4 text-sm";

        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        // Validate passwords match
        if (password !== confirmPassword) {
          messageEl.textContent = "Passwords do not match";
          messageEl.classList.add("text-rose-400");
          return;
        }

        try {
          const response = await fetch(`${API_BASE}/reset-password/${token}`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ password }),
          });

          const result = await response.json();

          if (!response.ok || result.success === false) {
            throw new Error(result.message || "Failed to reset password");
          }

          messageEl.textContent = "✓ Password reset successfully! Redirecting to login...";
          messageEl.classList.add("text-emerald-400");

          setTimeout(() => {
            window.location.href = "/login.html";
          }, 1500);
        } catch (error) {
          messageEl.textContent = error.message;
          messageEl.classList.add("text-rose-400");
        }
      });
    </script>
  </body>
</html>
