<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password – SeatSecure</title>
    <meta name="description" content="Set a new password for your SeatSecure account." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg-deep: #060818;
        --card-bg: rgba(12, 16, 36, 0.8);
        --border: rgba(255,255,255,0.07);
        --sky: #38bdf8;
        --sky-glow: rgba(56,189,248,0.28);
        --cyan: #22d3ee;
        --emerald: #10b981;
        --text-primary: #f0f4ff;
        --text-muted: #8892aa;
        --input-bg: rgba(255,255,255,0.04);
        --input-border: rgba(255,255,255,0.1);
      }

      body {
        font-family: 'Inter', sans-serif;
        background: var(--bg-deep);
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        color: var(--text-primary); overflow: hidden;
      }

      .bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
      .orb {
        position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.15;
        animation: drift 16s ease-in-out infinite alternate;
      }
      .orb-1 { width: 450px; height: 450px; background: radial-gradient(circle, var(--sky), transparent); top: -10%; right: -5%; }
      .orb-2 { width: 380px; height: 380px; background: radial-gradient(circle, #f59e0b, transparent); bottom: -10%; left: -5%; animation-delay: -8s; }
      @keyframes drift { from { transform: translate(0,0); } to { transform: translate(25px, 30px); } }

      .bg-grid {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background-image:
          linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
        background-size: 48px 48px;
      }

      .card-wrap { position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 20px; }

      .card {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: 24px; padding: 44px 40px;
        backdrop-filter: blur(24px);
        box-shadow: 0 32px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
      }

      .brand {
        display: flex; align-items: center; gap: 10px; margin-bottom: 32px; justify-content: center;
      }
      .brand-icon {
        width: 40px; height: 40px; border-radius: 12px;
        background: linear-gradient(135deg, var(--sky), var(--cyan));
        display: flex; align-items: center; justify-content: center; font-size: 20px;
        box-shadow: 0 0 20px var(--sky-glow);
      }
      .brand-name {
        font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.3rem;
        background: linear-gradient(135deg, var(--sky), var(--cyan));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      }

      .icon-badge {
        width: 64px; height: 64px; border-radius: 18px;
        background: linear-gradient(135deg, rgba(56,189,248,0.15), rgba(34,211,238,0.05));
        border: 1px solid rgba(56,189,248,0.2);
        display: flex; align-items: center; justify-content: center;
        font-size: 28px; margin: 0 auto 24px;
      }

      h1 { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.9rem; margin-bottom: 6px; }
      .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 32px; }

      .field { margin-bottom: 18px; }
      label {
        display: block; font-size: 0.8rem; font-weight: 600;
        color: var(--text-muted); margin-bottom: 7px; letter-spacing: 0.3px; text-transform: uppercase;
      }

      .input-wrap { position: relative; }
      input[type="password"], input[type="text"] {
        width: 100%; background: var(--input-bg); border: 1px solid var(--input-border);
        border-radius: 12px; padding: 13px 46px 13px 16px; color: var(--text-primary);
        font-size: 0.95rem; font-family: 'Inter', sans-serif; outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }
      input:focus {
        border-color: var(--sky); background: rgba(56,189,248,0.04);
        box-shadow: 0 0 0 3px rgba(56,189,248,0.12);
      }
      input::placeholder { color: rgba(136,146,170,0.5); }
      input.error-field { border-color: rgba(244,63,94,0.5) !important; }

      .toggle-pw {
        position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
        background: none; border: none; color: var(--text-muted); cursor: pointer;
        font-size: 16px; display: flex; align-items: center; padding: 2px;
        transition: color 0.15s;
      }
      .toggle-pw:hover { color: var(--text-primary); }

      /* Match indicator */
      .match-indicator {
        font-size: 0.75rem; margin-top: 6px;
        transition: color 0.2s; min-height: 18px;
      }

      .btn-submit {
        width: 100%; padding: 14px;
        background: linear-gradient(135deg, var(--sky), var(--cyan));
        color: #fff; border: none; border-radius: 12px;
        font-family: 'Inter', sans-serif; font-size: 1rem; font-weight: 700;
        cursor: pointer; margin-top: 8px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 4px 20px var(--sky-glow);
        position: relative; overflow: hidden;
        display: flex; align-items: center; justify-content: center; gap: 8px;
      }
      .btn-submit::before {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
        opacity: 0; transition: opacity 0.2s;
      }
      .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 28px var(--sky-glow); }
      .btn-submit:hover::before { opacity: 1; }
      .btn-submit:active { transform: translateY(0); }
      .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

      .spinner {
        width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff; border-radius: 50%;
        animation: spin 0.7s linear infinite; display: none;
      }
      .btn-submit.loading .spinner { display: block; }
      .btn-submit.loading .btn-text { opacity: 0.7; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .message {
        margin-top: 14px; font-size: 0.875rem; padding: 12px 16px; border-radius: 10px;
        display: none; align-items: center; gap: 8px;
      }
      .message.visible { display: flex; }
      .message.success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25); color: #a7f3d0; }
      .message.error   { background: rgba(244,63,94,0.1);  border: 1px solid rgba(244,63,94,0.25);  color: #fda4af; }

      .link-row { text-align: center; margin-top: 12px; font-size: 0.875rem; color: var(--text-muted); }
      a.link { color: var(--sky); font-weight: 600; text-decoration: none; transition: color 0.15s; }
      a.link:hover { color: var(--cyan); text-decoration: underline; }
      a.link-muted { color: var(--text-muted); text-decoration: none; transition: color 0.15s; font-size: 0.8rem; }
      a.link-muted:hover { color: var(--text-primary); }
      .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

      /* No token state */
      .no-token {
        text-align: center; padding: 20px 0;
        display: none;
      }
      .no-token .icon-large { font-size: 48px; margin-bottom: 16px; }
      .no-token h2 { font-family: 'Outfit', sans-serif; font-size: 1.3rem; margin-bottom: 8px; }
      .no-token p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }
    </style>
  </head>
  <body>
    <div class="bg-canvas">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
    </div>
    <div class="bg-grid"></div>

    <main class="card-wrap">
      <div class="card">
        <div class="brand">
          <div class="brand-icon">🎬</div>
          <div class="brand-name">SeatSecure</div>
        </div>

        <div id="form-section">
          <div class="icon-badge">🛡️</div>
          <h1>New password</h1>
          <p class="subtitle">Enter a strong new password for your account.</p>

          <form id="reset-form" novalidate>
            <div class="field">
              <label for="password">New Password</label>
              <div class="input-wrap">
                <input id="password" name="password" type="password" required minlength="8" placeholder="At least 8 characters" autocomplete="new-password" />
                <button type="button" class="toggle-pw" data-target="password" aria-label="Toggle password visibility">👁</button>
              </div>
            </div>

            <div class="field">
              <label for="confirm-password">Confirm Password</label>
              <div class="input-wrap">
                <input id="confirm-password" name="confirm-password" type="password" required minlength="8" placeholder="Repeat your password" autocomplete="new-password" />
                <button type="button" class="toggle-pw" data-target="confirm-password" aria-label="Toggle confirm password visibility">👁</button>
              </div>
              <div class="match-indicator" id="match-indicator"></div>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">
              <div class="spinner"></div>
              <span class="btn-text">Reset Password</span>
            </button>
          </form>
        </div>

        <!-- No token state -->
        <div class="no-token" id="no-token-state">
          <div class="icon-large">⚠️</div>
          <h2>Invalid link</h2>
          <p>This password reset link is missing or invalid. Please request a new one.</p>
          <a href="/forgot-password.html" class="btn-submit" style="display:inline-flex;text-decoration:none;max-width:240px;margin:0 auto;">
            Request new link
          </a>
        </div>

        <div id="message" class="message"></div>

        <hr class="divider" />
        <p class="link-row">
          <a href="/login.html" class="link-muted">← Back to login</a>
        </p>
      </div>
    </main>

    <script>
      const API_BASE = 'http://localhost:4000/api/auth';
      const form = document.getElementById('reset-form');
      const msgEl = document.getElementById('message');
      const submitBtn = document.getElementById('submit-btn');
      const passwordInput = document.getElementById('password');
      const confirmInput  = document.getElementById('confirm-password');
      const matchEl = document.getElementById('match-indicator');

      // Extract token
      const getToken = () => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('token')) return params.get('token');
        const parts = window.location.pathname.split('/');
        const idx = parts.indexOf('reset-password');
        if (idx !== -1 && parts[idx + 1]) return parts[idx + 1];
        return null;
      };

      const token = getToken();
      if (!token) {
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('no-token-state').style.display = 'block';
      }

      // Toggle password visibility
      document.querySelectorAll('.toggle-pw').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = document.getElementById(btn.dataset.target);
          target.type = target.type === 'password' ? 'text' : 'password';
          btn.textContent = target.type === 'password' ? '👁' : '🙈';
        });
      });

      // Match indicator
      function checkMatch() {
        if (!confirmInput.value) { matchEl.textContent = ''; return; }
        if (passwordInput.value === confirmInput.value) {
          matchEl.textContent = '✓ Passwords match';
          matchEl.style.color = '#10b981';
          confirmInput.classList.remove('error-field');
        } else {
          matchEl.textContent = '✕ Passwords do not match';
          matchEl.style.color = '#f43f5e';
          confirmInput.classList.add('error-field');
        }
      }
      confirmInput.addEventListener('input', checkMatch);
      passwordInput.addEventListener('input', checkMatch);

      function setMessage(text, type) {
        msgEl.textContent = text; msgEl.className = `message visible ${type}`;
      }
      function setLoading(loading) {
        submitBtn.classList.toggle('loading', loading); submitBtn.disabled = loading;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (passwordInput.value !== confirmInput.value) {
          setMessage('Passwords do not match.', 'error'); return;
        }
        msgEl.className = 'message';
        setLoading(true);

        try {
          const response = await fetch(`${API_BASE}/reset-password/${token}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: passwordInput.value }),
          });
          const result = await response.json();

          if (!response.ok || result.success === false) throw new Error(result.message || 'Failed to reset password');

          setMessage('✓ Password reset successfully! Redirecting to login...', 'success');
          setTimeout(() => { window.location.href = '/login.html'; }, 1500);
        } catch (err) {
          setMessage(err.message, 'error');
        } finally {
          setLoading(false);
        }
      });
    </script>
  </body>
</html>
