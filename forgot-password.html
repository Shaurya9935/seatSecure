<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | book-my-show</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap");
      body {
        font-family: "Outfit", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-slate-100 flex items-center justify-center p-6">
    <main class="w-full max-w-md rounded-2xl border border-slate-700/60 bg-slate-800/80 backdrop-blur-xl p-8 shadow-2xl">
      <h1 class="text-3xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-cyan-400">Reset Password</h1>
      <p class="text-slate-400 mb-6">Enter your email to receive password reset instructions.</p>

      <form id="forgot-form" class="space-y-4">
        <div>
          <label for="email" class="block text-sm mb-1 text-slate-300">Email</label>
          <input id="email" name="email" type="email" required class="w-full rounded-xl border border-slate-600 bg-slate-900/70 px-4 py-3 outline-none focus:ring-2 focus:ring-sky-400" />
        </div>

        <button type="submit" class="w-full rounded-xl bg-sky-500 px-4 py-3 font-semibold text-white transition hover:bg-sky-400">Send Reset Link</button>
      </form>

      <p id="message" class="mt-4 text-sm"></p>

      <p class="mt-6 text-center text-slate-400">
        Remember your password?
        <a href="/login.html" class="text-emerald-400 font-semibold hover:underline">Back to login</a>
      </p>
      <p class="mt-2 text-center">
        <a href="/index.html" class="text-slate-300 hover:text-white">Back to seats</a>
      </p>
    </main>

    <script>
      const API_BASE = "http://localhost:4000/api/auth";
      const form = document.getElementById("forgot-form");
      const messageEl = document.getElementById("message");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        messageEl.textContent = "";
        messageEl.className = "mt-4 text-sm";

        const formData = new FormData(form);
        const payload = {
          email: formData.get("email"),
        };

        try {
          const response = await fetch(`${API_BASE}/forgot-password`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });

          const result = await response.json();

          if (!response.ok || result.success === false) {
            throw new Error(result.message || "Failed to send reset email");
          }

          messageEl.textContent = "✓ Password reset link sent to your email. Check your inbox.";
          messageEl.classList.add("text-emerald-400");

          // Clear form
          form.reset();
        } catch (error) {
          messageEl.textContent = error.message;
          messageEl.classList.add("text-rose-400");
        }
      });
    </script>
  </body>
</html>
