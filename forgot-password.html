<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password – SeatSecure</title>
    <meta name="description" content="Reset your SeatSecure password by entering your email address." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg-deep: #060818;
        --card-bg: rgba(12, 16, 36, 0.8);
        --border: rgba(255,255,255,0.07);
        --sky: #38bdf8;
        --sky-glow: rgba(56,189,248,0.28);
        --cyan: #22d3ee;
        --emerald: #10b981;
        --text-primary: #f0f4ff;
        --text-muted: #8892aa;
        --input-bg: rgba(255,255,255,0.04);
        --input-border: rgba(255,255,255,0.1);
      }

      body {
        font-family: 'Inter', sans-serif;
        background: var(--bg-deep);
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        color: var(--text-primary); overflow: hidden;
      }

      .bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
      .orb {
        position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.16;
        animation: drift 16s ease-in-out infinite alternate;
      }
      .orb-1 { width: 450px; height: 450px; background: radial-gradient(circle, var(--sky), transparent); top: -10%; left: -5%; }
      .orb-2 { width: 380px; height: 380px; background: radial-gradient(circle, var(--emerald), transparent); bottom: -10%; right: -5%; animation-delay: -8s; }
      @keyframes drift { from { transform: translate(0,0); } to { transform: translate(25px, 30px); } }

      .bg-grid {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background-image:
          linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
        background-size: 48px 48px;
      }

      .card-wrap { position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 20px; }

      .card {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: 24px; padding: 44px 40px;
        backdrop-filter: blur(24px);
        box-shadow: 0 32px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
      }

      .brand {
        display: flex; align-items: center; gap: 10px; margin-bottom: 32px; justify-content: center;
      }
      .brand-icon {
        width: 40px; height: 40px; border-radius: 12px;
        background: linear-gradient(135deg, var(--sky), var(--cyan));
        display: flex; align-items: center; justify-content: center; font-size: 20px;
        box-shadow: 0 0 20px var(--sky-glow);
      }
      .brand-name {
        font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.3rem;
        background: linear-gradient(135deg, var(--sky), var(--cyan));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      }

      /* Icon badge */
      .icon-badge {
        width: 64px; height: 64px; border-radius: 18px;
        background: linear-gradient(135deg, rgba(56,189,248,0.15), rgba(34,211,238,0.05));
        border: 1px solid rgba(56,189,248,0.2);
        display: flex; align-items: center; justify-content: center;
        font-size: 28px; margin: 0 auto 24px;
      }

      h1 { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.9rem; margin-bottom: 6px; }
      .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 32px; line-height: 1.5; }

      .field { margin-bottom: 18px; }
      label {
        display: block; font-size: 0.8rem; font-weight: 600;
        color: var(--text-muted); margin-bottom: 7px; letter-spacing: 0.3px; text-transform: uppercase;
      }
      input {
        width: 100%; background: var(--input-bg); border: 1px solid var(--input-border);
        border-radius: 12px; padding: 13px 16px; color: var(--text-primary);
        font-size: 0.95rem; font-family: 'Inter', sans-serif; outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }
      input:focus {
        border-color: var(--sky); background: rgba(56,189,248,0.04);
        box-shadow: 0 0 0 3px rgba(56,189,248,0.12);
      }
      input::placeholder { color: rgba(136,146,170,0.5); }

      .btn-submit {
        width: 100%; padding: 14px;
        background: linear-gradient(135deg, var(--sky), var(--cyan));
        color: #fff; border: none; border-radius: 12px;
        font-family: 'Inter', sans-serif; font-size: 1rem; font-weight: 700;
        cursor: pointer; margin-top: 8px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 4px 20px var(--sky-glow);
        position: relative; overflow: hidden;
        display: flex; align-items: center; justify-content: center; gap: 8px;
      }
      .btn-submit::before {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
        opacity: 0; transition: opacity 0.2s;
      }
      .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 28px var(--sky-glow); }
      .btn-submit:hover::before { opacity: 1; }
      .btn-submit:active { transform: translateY(0); }
      .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

      .spinner {
        width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff; border-radius: 50%;
        animation: spin 0.7s linear infinite; display: none;
      }
      .btn-submit.loading .spinner { display: block; }
      .btn-submit.loading .btn-text { opacity: 0.7; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .message {
        margin-top: 14px; font-size: 0.875rem; padding: 12px 16px; border-radius: 10px;
        display: none; align-items: flex-start; gap: 10px; line-height: 1.5;
      }
      .message.visible { display: flex; }
      .message.success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25); color: #a7f3d0; }
      .message.error   { background: rgba(244,63,94,0.1);  border: 1px solid rgba(244,63,94,0.25);  color: #fda4af; }

      .link-row { text-align: center; margin-top: 12px; font-size: 0.875rem; color: var(--text-muted); }
      a.link { color: var(--emerald); font-weight: 600; text-decoration: none; transition: color 0.15s; }
      a.link:hover { color: var(--sky); text-decoration: underline; }
      a.link-muted { color: var(--text-muted); text-decoration: none; transition: color 0.15s; font-size: 0.8rem; }
      a.link-muted:hover { color: var(--text-primary); }
      .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    </style>
  </head>
  <body>
    <div class="bg-canvas">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
    </div>
    <div class="bg-grid"></div>

    <main class="card-wrap">
      <div class="card">
        <div class="brand">
          <div class="brand-icon">🎬</div>
          <div class="brand-name">SeatSecure</div>
        </div>

        <div class="icon-badge">🔑</div>
        <h1>Forgot password?</h1>
        <p class="subtitle">No worries! Enter your email and we'll send you a reset link right away.</p>

        <form id="forgot-form" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" required placeholder="you@example.com" autocomplete="email" />
          </div>

          <button type="submit" class="btn-submit" id="submit-btn">
            <div class="spinner"></div>
            <span class="btn-text">Send Reset Link</span>
          </button>
        </form>

        <div id="message" class="message"></div>

        <hr class="divider" />

        <p class="link-row">
          Remember it now? <a href="/login.html" class="link">Back to login</a>
        </p>
        <p class="link-row" style="margin-top:8px;">
          <a href="/index.html" class="link-muted">← Back to seats</a>
        </p>
      </div>
    </main>

    <script>
      const API_BASE = 'http://localhost:4000/api/auth';
      const form = document.getElementById('forgot-form');
      const msgEl = document.getElementById('message');
      const submitBtn = document.getElementById('submit-btn');

      function setMessage(text, type) {
        msgEl.innerHTML = text;
        msgEl.className = `message visible ${type}`;
      }
      function setLoading(loading) {
        submitBtn.classList.toggle('loading', loading);
        submitBtn.disabled = loading;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msgEl.className = 'message';
        setLoading(true);

        const payload = { email: form.email.value };

        try {
          const response = await fetch(`${API_BASE}/forgot-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const result = await response.json();

          if (!response.ok || result.success === false) throw new Error(result.message || 'Failed to send reset email');

          setMessage('✓ Password reset link sent! Check your inbox.', 'success');
          form.reset();
        } catch (err) {
          setMessage(err.message, 'error');
        } finally {
          setLoading(false);
        }
      });
    </script>
  </body>
</html>
