<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | book-my-show</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap");
      body {
        font-family: "Outfit", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-slate-100 flex items-center justify-center p-6">
    <main class="w-full max-w-md rounded-2xl border border-slate-700/60 bg-slate-800/80 backdrop-blur-xl p-8 shadow-2xl">
      <h1 class="text-3xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">Welcome Back</h1>
      <p class="text-slate-400 mb-6">Login to continue booking your seat.</p>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="email" class="block text-sm mb-1 text-slate-300">Email</label>
          <input id="email" name="email" type="email" required class="w-full rounded-xl border border-slate-600 bg-slate-900/70 px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-400" />
        </div>

        <div>
          <label for="password" class="block text-sm mb-1 text-slate-300">Password</label>
          <input id="password" name="password" type="password" required class="w-full rounded-xl border border-slate-600 bg-slate-900/70 px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-400" />
        </div>

        <button type="submit" class="w-full rounded-xl bg-emerald-500 px-4 py-3 font-semibold text-white transition hover:bg-emerald-400">Login</button>
      </form>

      <p id="message" class="mt-4 text-sm"></p>

      <p class="mt-6 text-center text-slate-400">
        New here?
        <a href="/register.html" class="text-emerald-400 font-semibold hover:underline">Create an account</a>
      </p>
      <p class="mt-2 text-center">
        <a href="/index.html" class="text-slate-300 hover:text-white">Back to seats</a>
      </p>
    </main>

    <script>
      const API_BASE = "http://localhost:4000/api/auth";
      const form = document.getElementById("login-form");
      const messageEl = document.getElementById("message");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        messageEl.textContent = "";
        messageEl.className = "mt-4 text-sm";

        const formData = new FormData(form);
        const payload = {
          email: formData.get("email"),
          password: formData.get("password"),
        };

        try {
          const response = await fetch(`${API_BASE}/login`, {
            method: "POST",
            credentials: "include",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });

          const result = await response.json();

          if (!response.ok || result.success === false) {
            throw new Error(result.message || "Login failed");
          }

          if (result.data?.accessToken) {
            localStorage.setItem("accessToken", result.data.accessToken);
          }
          if (result.data?.refreshToken) {
            localStorage.setItem("refreshToken", result.data.refreshToken);
          }

          messageEl.textContent = "Login successful. Redirecting...";
          messageEl.classList.add("text-emerald-400");

          setTimeout(() => {
            window.location.href = "/index.html";
          }, 700);
        } catch (error) {
          messageEl.textContent = error.message;
          messageEl.classList.add("text-rose-400");
        }
      });
    </script>
  </body>
</html>
