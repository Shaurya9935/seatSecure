<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SeatSecure – Book Your Seat</title>
    <meta name="description" content="Book movie seats instantly on SeatSecure. Secure, real-time seat reservation for ChaiCode Cinema." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg-deep:    #060818;
        --bg-card:    rgba(13, 18, 40, 0.75);
        --border:     rgba(255,255,255,0.07);
        --emerald:    #10b981;
        --emerald-glow: rgba(16,185,129,0.35);
        --rose:       #f43f5e;
        --rose-dim:   rgba(244,63,94,0.12);
        --cyan:       #22d3ee;
        --gold:       #f59e0b;
        --text-primary: #f0f4ff;
        --text-muted:   #8892aa;
        --seat-size: clamp(52px, 7vw, 80px);
      }

      body {
        font-family: 'Inter', 'Outfit', sans-serif;
        background-color: var(--bg-deep);
        color: var(--text-primary);
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* ── Animated background ───────────────────────────────── */
      .bg-canvas {
        position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
      }
      .orb {
        position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.18;
        animation: drift 18s ease-in-out infinite alternate;
      }
      .orb-1 { width: 600px; height: 600px; background: radial-gradient(circle, #0ea5e9, transparent); top: -10%; left: -10%; animation-delay: 0s; }
      .orb-2 { width: 500px; height: 500px; background: radial-gradient(circle, #10b981, transparent); bottom: -5%; right: -5%; animation-delay: -6s; }
      .orb-3 { width: 350px; height: 350px; background: radial-gradient(circle, #8b5cf6, transparent); top: 40%; left: 50%; animation-delay: -12s; }

      @keyframes drift {
        from { transform: translate(0, 0) scale(1); }
        to   { transform: translate(30px, 40px) scale(1.08); }
      }

      /* ── Grid overlay ────────────────────────────────────────── */
      .bg-grid {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background-image:
          linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 60px 60px;
      }

      /* ── Layout ─────────────────────────────────────────────── */
      .page-wrap {
        position: relative; z-index: 1;
        min-height: 100vh;
        display: flex; flex-direction: column;
      }

      /* ── Navbar ──────────────────────────────────────────────── */
      .navbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 18px 32px;
        background: rgba(6,8,24,0.6);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border);
        position: sticky; top: 0; z-index: 50;
      }
      .logo {
        display: flex; align-items: center; gap: 10px;
        font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.3rem;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, var(--emerald), var(--cyan));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      }
      .logo-icon {
        width: 36px; height: 36px; background: linear-gradient(135deg, var(--emerald), var(--cyan));
        border-radius: 10px; display: flex; align-items: center; justify-content: center;
        font-size: 18px; flex-shrink: 0;
        box-shadow: 0 0 20px var(--emerald-glow);
      }
      .nav-actions { display: flex; align-items: center; gap: 10px; }

      .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 20px;
        border-radius: 10px; font-size: 0.875rem; font-weight: 600; cursor: pointer;
        transition: all 0.2s ease; text-decoration: none; border: none; font-family: inherit;
      }
      .btn-ghost {
        background: transparent; border: 1px solid rgba(255,255,255,0.12);
        color: var(--text-muted);
      }
      .btn-ghost:hover { border-color: var(--cyan); color: var(--cyan); background: rgba(34,211,238,0.06); }
      .btn-primary {
        background: linear-gradient(135deg, var(--emerald), #059669);
        color: #fff; box-shadow: 0 0 18px var(--emerald-glow);
      }
      .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 24px var(--emerald-glow); }
      .btn-danger {
        background: transparent; border: 1px solid rgba(244,63,94,0.3);
        color: #fb7185;
      }
      .btn-danger:hover { background: rgba(244,63,94,0.08); border-color: var(--rose); }

      .user-chip {
        display: flex; align-items: center; gap: 8px;
        padding: 6px 14px; border-radius: 24px;
        background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.2);
        font-size: 0.85rem; color: var(--text-muted);
      }
      .user-avatar {
        width: 28px; height: 28px; border-radius: 50%;
        background: linear-gradient(135deg, var(--emerald), var(--cyan));
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: 700; color: #fff;
      }
      .user-name { color: #a7f3d0; font-weight: 600; }

      /* ── Hero section ───────────────────────────────────────── */
      .hero { text-align: center; padding: 52px 32px 36px; }
      .hero-badge {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 600;
        background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.25);
        color: var(--gold); margin-bottom: 20px; letter-spacing: 0.5px;
        animation: pulse-badge 2.5s ease-in-out infinite;
      }
      @keyframes pulse-badge {
        0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.2); }
        50%       { box-shadow: 0 0 0 6px rgba(245,158,11,0); }
      }
      .hero-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: blink 1.2s steps(1) infinite; }
      @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

      .hero-title {
        font-family: 'Outfit', sans-serif; font-weight: 800;
        font-size: clamp(2rem, 5vw, 3.2rem);
        line-height: 1.1; letter-spacing: -1px;
        color: var(--text-primary);
        margin-bottom: 8px;
      }
      .hero-movie {
        font-size: clamp(1.1rem, 3vw, 1.6rem); font-weight: 700;
        background: linear-gradient(135deg, #f43f5e, #fb923c);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        margin-top: 6px;
      }
      .hero-subtitle { color: var(--text-muted); font-size: 1rem; margin-top: 10px; }

      /* ── Screen indicator ───────────────────────────────────── */
      .screen-wrap { display: flex; justify-content: center; padding: 0 32px 12px; }
      .screen-bar {
        width: min(480px, 90%); height: 6px; border-radius: 4px;
        background: linear-gradient(90deg, transparent 5%, rgba(255,255,255,0.12) 50%, transparent 95%);
        position: relative;
      }
      .screen-label {
        position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
        font-size: 0.7rem; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase;
      }

      /* ── Legend ──────────────────────────────────────────────── */
      .legend {
        display: flex; justify-content: center; gap: 28px; padding: 40px 32px 24px;
        flex-wrap: wrap;
      }
      .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--text-muted); }
      .swatch {
        width: 22px; height: 22px; border-radius: 6px;
      }
      .swatch-avail { background: linear-gradient(135deg, var(--emerald), #059669); box-shadow: 0 0 10px var(--emerald-glow); }
      .swatch-booked { background: var(--rose-dim); border: 1px solid rgba(244,63,94,0.3); }
      .swatch-yours { background: linear-gradient(135deg, #8b5cf6, #6d28d9); box-shadow: 0 0 10px rgba(139,92,246,0.3); }

      /* ── Seat Grid ───────────────────────────────────────────── */
      .seats-section {
        display: flex; justify-content: center; padding: 0 24px 60px;
      }
      .seats-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 36px;
        backdrop-filter: blur(20px);
        box-shadow: 0 24px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
        width: 100%; max-width: 860px;
      }
      .seats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(var(--seat-size), 1fr));
        gap: 12px;
        justify-items: center;
      }

      /* ── Individual Seat ─────────────────────────────────────── */
      .seat {
        width: var(--seat-size); height: var(--seat-size);
        border-radius: 14px; display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: clamp(0.75rem, 2vw, 1rem);
        cursor: pointer; position: relative;
        transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s ease, background 0.2s ease;
        user-select: none; outline: none;
        animation: seat-appear 0.4s ease both;
      }
      @keyframes seat-appear {
        from { opacity: 0; transform: scale(0.7) translateY(10px); }
        to   { opacity: 1; transform: scale(1) translateY(0); }
      }

      .seat-avail {
        background: linear-gradient(145deg, #10b981, #059669);
        color: #fff;
        border: none;
        box-shadow: 0 4px 16px rgba(16,185,129,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
      }
      .seat-avail:hover {
        transform: translateY(-4px) scale(1.08);
        box-shadow: 0 12px 32px rgba(16,185,129,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
      }
      .seat-avail:active { transform: scale(0.94); }

      .seat-booked {
        background: var(--rose-dim);
        color: rgba(244,63,94,0.5);
        border: 1px solid rgba(244,63,94,0.2);
        cursor: not-allowed; box-shadow: none;
      }

      /* Tooltip */
      .seat-tooltip {
        position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%) scale(0.9);
        background: rgba(10,12,30,0.95); border: 1px solid rgba(255,255,255,0.1);
        backdrop-filter: blur(12px);
        padding: 8px 14px; border-radius: 10px;
        font-size: 0.75rem; font-weight: 500; color: var(--text-muted);
        white-space: nowrap; pointer-events: none;
        opacity: 0; transition: opacity 0.18s ease, transform 0.18s ease;
        z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      }
      .seat-tooltip strong { color: var(--text-primary); }
      .seat-tooltip::after {
        content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
        border: 5px solid transparent; border-top-color: rgba(255,255,255,0.1);
      }
      .seat-booked:hover .seat-tooltip { opacity: 1; transform: translateX(-50%) scale(1); }

      /* Loading skeleton */
      .skeleton {
        background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.6s infinite;
        border-radius: 14px;
        width: var(--seat-size); height: var(--seat-size);
      }
      @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

      /* ── Toast notification ─────────────────────────────────── */
      #toast-container {
        position: fixed; top: 80px; right: 24px; z-index: 9999;
        display: flex; flex-direction: column; gap: 10px;
        pointer-events: none;
      }
      .toast {
        padding: 14px 20px; border-radius: 14px;
        font-size: 0.875rem; font-weight: 500;
        backdrop-filter: blur(20px);
        box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        display: flex; align-items: center; gap: 10px;
        min-width: 240px; max-width: 360px;
        pointer-events: auto;
        opacity: 1;
        transition: display 0.4s, opacity 0.4s ease-out, translate 0.4s ease-out;
        transition-behavior: allow-discrete;
      }
      @starting-style { .toast { opacity: 0; translate: 20px 0; } }
      .toast[hidden] { display: none; opacity: 0; translate: 20px 0; }
      .toast-success { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #a7f3d0; }
      .toast-error   { background: rgba(244,63,94,0.12);  border: 1px solid rgba(244,63,94,0.3);  color: #fda4af; }
      .toast-icon { font-size: 1.1rem; flex-shrink: 0; }

      /* ── Modal ─────────────────────────────────────────────── */
      #confirm-modal {
        position: fixed; inset: 0; z-index: 999;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
        opacity: 1;
        transition: display 0.3s, opacity 0.3s ease-out;
        transition-behavior: allow-discrete;
      }
      @starting-style { #confirm-modal { opacity: 0; } }
      #confirm-modal[hidden] { display: none; opacity: 0; }
      .modal-box {
        background: rgba(13,18,40,0.95); border: 1px solid rgba(255,255,255,0.1);
        backdrop-filter: blur(24px); border-radius: 20px;
        padding: 36px; max-width: 380px; width: 90%;
        box-shadow: 0 40px 80px rgba(0,0,0,0.7);
        text-align: center;
        opacity: 1; translate: 0 0;
        transition: display 0.3s, opacity 0.3s ease-out, translate 0.3s cubic-bezier(0.34,1.56,0.64,1);
        transition-behavior: allow-discrete;
      }
      @starting-style { .modal-box { opacity: 0; translate: 0 30px; } }
      #confirm-modal[hidden] .modal-box { opacity: 0; translate: 0 30px; }

      .modal-seat-num {
        display: inline-flex; align-items: center; justify-content: center;
        width: 72px; height: 72px; border-radius: 18px; font-size: 1.8rem; font-weight: 800;
        background: linear-gradient(135deg, var(--emerald), #059669);
        box-shadow: 0 0 32px var(--emerald-glow);
        margin-bottom: 20px; color: #fff;
      }
      .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
      .modal-desc  { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 28px; line-height: 1.5; }
      .modal-actions { display: flex; gap: 12px; }
      .modal-actions .btn { flex: 1; justify-content: center; padding: 12px; }
      .btn-cancel { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--text-muted); }
      .btn-cancel:hover { background: rgba(255,255,255,0.1); }
      .btn-confirm { background: linear-gradient(135deg, var(--emerald), #059669); color: #fff; border: none; box-shadow: 0 0 20px var(--emerald-glow); }
      .btn-confirm:hover { transform: translateY(-1px); box-shadow: 0 4px 28px var(--emerald-glow); }

      /* ── Stats bar ───────────────────────────────────────────── */
      .stats-bar {
        display: flex; justify-content: center; gap: 40px; padding: 0 32px 32px;
        flex-wrap: wrap;
      }
      .stat { text-align: center; }
      .stat-num { font-size: 1.6rem; font-weight: 800; font-family: 'Outfit', sans-serif; }
      .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
      .stat-avail .stat-num { color: var(--emerald); }
      .stat-booked .stat-num { color: var(--rose); }

      @media (max-width: 600px) {
        .navbar { padding: 14px 16px; }
        .seats-card { padding: 20px 12px; }
        .seats-grid { gap: 8px; }
        .hero { padding: 32px 16px 24px; }
        .legend { gap: 16px; padding: 28px 16px 16px; }
        .stats-bar { gap: 24px; }
      }
    </style>
  </head>
  <body>
    <div class="bg-canvas">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>
    <div class="bg-grid"></div>

    <div class="page-wrap">
      <!-- Navbar -->
      <nav class="navbar">
        <div class="logo">
          <div class="logo-icon">🎬</div>
          SeatSecure
        </div>

        <div class="nav-actions" id="guest-actions">
          <a href="/login.html" class="btn btn-ghost" id="nav-login-btn">Login</a>
          <a href="/register.html" class="btn btn-primary" id="nav-register-btn">Register</a>
        </div>

        <div class="nav-actions" id="user-actions" style="display:none;">
          <div class="user-chip">
            <div class="user-avatar" id="user-avatar-letter">U</div>
            <span>Logged in as</span>
            <span class="user-name" id="logged-user-name"></span>
          </div>
          <button id="logout-btn" class="btn btn-danger">Logout</button>
        </div>
      </nav>

      <!-- Hero -->
      <header class="hero">
        <div class="hero-badge">
          <span class="hero-dot"></span>
          Now Showing
        </div>
        <h1 class="hero-title">ChaiCode Cinema</h1>
        <p class="hero-movie">Dhurandhar – The Revenge</p>
        <p class="hero-subtitle">Jassi ko ghar ki yaad kyu nhi aai?</p>
      </header>

      <!-- Screen -->
      <div class="screen-wrap">
        <div class="screen-bar"><span class="screen-label">Screen</span></div>
      </div>

      <!-- Legend -->
      <div class="legend">
        <div class="legend-item"><div class="swatch swatch-avail"></div> Available</div>
        <div class="legend-item"><div class="swatch swatch-booked"></div> Booked</div>
      </div>

      <!-- Stats -->
      <div class="stats-bar">
        <div class="stat stat-avail">
          <div class="stat-num" id="stat-avail">–</div>
          <div class="stat-label">Available</div>
        </div>
        <div class="stat stat-booked">
          <div class="stat-num" id="stat-booked">–</div>
          <div class="stat-label">Booked</div>
        </div>
        <div class="stat">
          <div class="stat-num" style="color:var(--cyan);" id="stat-total">–</div>
          <div class="stat-label">Total Seats</div>
        </div>
      </div>

      <!-- Seats -->
      <section class="seats-section">
        <div class="seats-card">
          <div class="seats-grid" id="seats-grid">
            <!-- Skeleton placeholders -->
            <script>
              for(let i=0;i<20;i++) document.write('<div class="skeleton" style="animation-delay:'+i*0.05+'s"></div>');
            </script>
          </div>
        </div>
      </section>
    </div>

    <!-- Confirm Modal -->
    <div id="confirm-modal" hidden>
      <div class="modal-box">
        <div class="modal-seat-num" id="modal-seat-num">?</div>
        <div class="modal-title">Confirm Booking</div>
        <p class="modal-desc" id="modal-desc">Are you sure you want to book this seat?</p>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="modal-cancel">Cancel</button>
          <button class="btn btn-confirm" id="modal-confirm">Book Now</button>
        </div>
      </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <script>
      /* ── Utilities ────────────────────────────────────── */
      const getCurrentUser = () => {
        try { return JSON.parse(localStorage.getItem('user') || 'null'); } catch { return null; }
      };

      function showToast(msg, type = 'success') {
        const c = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = `toast toast-${type}`;
        t.innerHTML = `<span class="toast-icon">${type === 'success' ? '✓' : '✕'}</span> ${msg}`;
        c.appendChild(t);
        setTimeout(() => { t.hidden = true; setTimeout(() => t.remove(), 500); }, 3500);
      }

      /* ── Auth UI ──────────────────────────────────────── */
      function setupAuthUI() {
        const user = getCurrentUser();
        const guestEl = document.getElementById('guest-actions');
        const userEl  = document.getElementById('user-actions');
        const nameEl  = document.getElementById('logged-user-name');
        const avatarEl = document.getElementById('user-avatar-letter');
        const logoutBtn = document.getElementById('logout-btn');

        if (user?.name) {
          guestEl.style.display = 'none';
          userEl.style.display = 'flex';
          nameEl.textContent = user.name;
          avatarEl.textContent = user.name.charAt(0).toUpperCase();
        } else {
          guestEl.style.display = 'flex';
          userEl.style.display = 'none';
        }
        logoutBtn?.addEventListener('click', () => {
          localStorage.removeItem('accessToken');
          localStorage.removeItem('user');
          window.location.href = '/login.html';
        });
      }

      /* ── Modal ────────────────────────────────────────── */
      let pendingSeatCallback = null;
      const modal = document.getElementById('confirm-modal');
      document.getElementById('modal-cancel').addEventListener('click', () => {
        modal.hidden = true; pendingSeatCallback = null;
      });
      modal.addEventListener('click', e => { if (e.target === modal) { modal.hidden = true; pendingSeatCallback = null; } });
      document.getElementById('modal-confirm').addEventListener('click', () => {
        modal.hidden = true;
        if (pendingSeatCallback) pendingSeatCallback();
        pendingSeatCallback = null;
      });

      function openConfirmModal(seatId, cb) {
        document.getElementById('modal-seat-num').textContent = seatId;
        document.getElementById('modal-desc').textContent = `Confirm booking for Seat #${seatId}? This action cannot be undone.`;
        pendingSeatCallback = cb;
        modal.hidden = false;
      }

      /* ── Main ─────────────────────────────────────────── */
      async function run() {
        const API_BASE = 'http://localhost:4000/api/booking';
        const grid = document.getElementById('seats-grid');

        let seats = [];
        try {
          const res = await fetch(`${API_BASE}/seats`);
          const payload = await res.json();
          seats = (payload.data ?? []).sort((a, b) => a.id - b.id);
        } catch(e) {
          grid.innerHTML = '<p style="color:var(--text-muted);text-align:center;grid-column:1/-1;padding:24px;">Could not load seats. Make sure the backend is running.</p>';
          return;
        }

        // Update stats
        const booked = seats.filter(s => s.isbooked).length;
        document.getElementById('stat-avail').textContent  = seats.length - booked;
        document.getElementById('stat-booked').textContent = booked;
        document.getElementById('stat-total').textContent  = seats.length;

        // Clear skeletons
        grid.innerHTML = '';

        seats.forEach((seat, idx) => {
          const el = document.createElement('div');
          el.className = 'seat ' + (seat.isbooked ? 'seat-booked' : 'seat-avail');
          el.style.animationDelay = `${idx * 0.04}s`;
          el.setAttribute('role', 'button');
          el.setAttribute('aria-label', seat.isbooked ? `Seat ${seat.id} – booked by ${seat.name}` : `Seat ${seat.id} – available`);

          if (seat.isbooked) {
            el.innerHTML = `
              ${seat.id}
              <div class="seat-tooltip">Booked by <strong>${seat.name || 'someone'}</strong></div>
            `;
          } else {
            el.textContent = seat.id;
            el.addEventListener('click', () => handleBook(el, seat.id, seats));
          }
          grid.appendChild(el);
        });
      }

      async function handleBook(el, seatId, seats) {
        const currentUser = getCurrentUser();
        if (!currentUser?.name) {
          showToast('Please login first to book a seat.', 'error');
          setTimeout(() => { window.location.href = '/login.html'; }, 1200);
          return;
        }

        openConfirmModal(seatId, async () => {
          el.style.pointerEvents = 'none';
          el.style.opacity = '0.6';

          try {
            const res = await fetch(`http://localhost:4000/api/booking/seats/${seatId}/book`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: currentUser.name }),
            });
            const data = await res.json();

            if (!res.ok || data.success === false) {
              showToast(data.message || 'Seat already booked!', 'error');
              el.style.pointerEvents = ''; el.style.opacity = '';
            } else {
              showToast(`🎉 Seat #${seatId} booked successfully!`, 'success');
              // Animate transition
              el.style.transition = 'all 0.35s cubic-bezier(0.34,1.56,0.64,1)';
              el.className = 'seat seat-booked';
              el.innerHTML = `
                ${seatId}
                <div class="seat-tooltip">Booked by <strong>${data?.data?.name || currentUser.name}</strong></div>
              `;
              // Update stats
              const avail = parseInt(document.getElementById('stat-avail').textContent);
              const booked = parseInt(document.getElementById('stat-booked').textContent);
              document.getElementById('stat-avail').textContent  = avail - 1;
              document.getElementById('stat-booked').textContent = booked + 1;
            }
          } catch(ex) {
            showToast('Network error: ' + ex.message, 'error');
            el.style.pointerEvents = ''; el.style.opacity = '';
          }
        });
      }

      setupAuthUI();
      run();
    </script>
  </body>
</html>
